
<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для тебя 👀</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f4f4f5;
      color: #18181b;
    }
    main {
      width: min(100%, 420px);
      padding: 40px 28px;
      text-align: center;
      background: white;
      border: 1px solid #e4e4e7;
      border-radius: 18px;
    }
    h1 { font-size: 28px; }
    p { color: #71717a; margin-bottom: 26px; }
    a {
      display: inline-block;
      padding: 13px 24px;
      border-radius: 10px;
      background: #18181b;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>У меня для тебя кое-что есть 👀</h1>
    <p>Открой, когда будешь готов(а).</p>
    <a href="./image/">Посмотреть</a>
  </main>
</body>
</html>
