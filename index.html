<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Для тебя</title>
  <meta name="description" content="Тут кое-что интересное.">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #f4f4f5; color: #18181b; }
    main { width: min(100%, 420px); text-align: center; background: white; padding: 40px 28px;
      border: 1px solid #e4e4e7; border-radius: 18px; box-shadow: 0 12px 35px #0000000a; }
    h1 { font-size: clamp(1.5rem, 5vw, 2rem); margin: 0 0 10px; letter-spacing: -.03em; }
    p { color: #71717a; margin: 0 0 26px; }
    a { display: inline-block; background: #18181b; color: white; padding: 13px 22px; border-radius: 10px;
      text-decoration: none; font-weight: 650; transition: transform .15s, background .15s; }
    a:hover { background: #3f3f46; transform: translateY(-1px); }
    a:focus-visible { outline: 3px solid #a1a1aa; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>У меня для тебя кое-что есть 👀</h1>
    <p>Открой, когда будешь готов)))))).</p>
    <a href="image/">Посмотреть</a>
  </main>
</body>
</html>
