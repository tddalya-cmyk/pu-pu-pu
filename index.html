<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сюрприз</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font: 16px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: #18181b; color: #fafafa; }
    main { width: min(100%, 900px); text-align: center; }
    h1 { font-size: clamp(1.5rem, 5vw, 2.3rem); margin: 0 0 20px; }
    img { display: block; max-width: 100%; max-height: 72vh; object-fit: contain; margin: 0 auto 20px;
      border-radius: 12px; background: #27272a; }
    .hint { color: #a1a1aa; font-size: .95rem; }
    a { color: #e4e4e7; }
    #missing { border: 1px dashed #71717a; border-radius: 12px; padding: 28px; color: #d4d4d8; }
  </style>
</head>
<body>
  <main>
    <h1>Вот и сюрприз 😈</h1>
    <img id="prank-image" src="picture.jpg" alt="Сюрприз-картинка" onerror="this.hidden=true; document.getElementById('missing').hidden=false;">
    <div id="missing" hidden>
      <p><strong>Картинка ещё не добавлена.</strong></p>
      <p>Положи свою картинку в эту папку и назови её <code>picture.jpg</code>.</p>
      <p>Если у тебя PNG, можешь назвать файл <code>picture.png</code> и изменить имя в атрибуте <code>src</code> в файле <code>image/index.html</code>.</p>
    </div>
    <p class="hint"><a href="../">Вернуться на первую страницу</a></p>
  </main>
</body>
</html>
